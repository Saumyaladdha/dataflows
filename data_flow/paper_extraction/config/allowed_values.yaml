category_ambiguous:
  elimination: check_each_statement claims 'Renamed - was elimination' while a row named `elimination`
    claims 'Kept as it was' -- the same v0.2 name is both renamed away and kept
  process: both `multi_step` and `sequence_based` claim 'Renamed - was process', and E3 has its own live
    `process`
category_means:
  asks:
    apply_rule: a rule you already know, used on a case you have not seen
    calculate: put numbers in and get a number out
    compare: the difference between two things, or the correct pairing
    experiment: a procedure, its setup, or what its data show
    fact_line: 'a fact NCERT states: what, who or where'
    new_asks: something the question wants that none of the above describes
    order: a sequence to put in the right order, or a trend to arrange
    read_diagram: read a figure, graph or drawn structure and answer from it
    reason_line: 'a reason NCERT gives: why it happens'
    reaction: what a reaction gives, or the reagent it needs
    relation: how much one quantity changes when another does
  qtype:
    assertion_reason: a labelled Assertion and Reason, judged for truth and explanation
    match_columns: two labelled lists to pair, the answer is a pairing code
    mcq: a question and four answers, nothing lettered or listed
    new_type: a printed shape none of the above describes
    statements: lettered statements, the answer is which combination is right
    two_part: the answer has two halves, usually joined by 'respectively'
  trap_v2:
    wrong_site_attacked: 'the reagent is right but it attacks the other site, atom or bond than the one the question turns on'
    answers_other_question: true, and about this topic, but it answers something else
    arithmetic_slip: the number or the unit is wrong, or a step was stopped short
    condition_missed: drop the condition the stem states and the option becomes true
    formula_misused: the right formula with a wrong power, a dropped term or the wrong quantity
    half_right: one part of the option is right and one part is wrong
    nearby_fact: a true fact about a neighbouring thing is offered instead
    new_trap: a way of catching a student that none of the above describes
    no_trap: nothing pulls; the other options are only filler
    reversed: 'the right thing stated backwards: direction, order or ratio'
