version: v0.3

# READABLE LABELS.
#
# The slugs above are the DATA -- stable, machine-matched, never shown as the headline. These are
# what a human reads on a card. Adding one here never changes a stored rating; it changes what the
# page prints. A value with no entry falls back to its slug, so a new value is legible the moment
# it exists and only loses the underscore once someone writes it a name.
display:
  flags:
    question_fault: Question fault
    disputed_key: Disputed key
    out_of_syllabus: Out of syllabus
    check_figure: Figure mismatch
  qtype:
    mcq: MCQ
    match_columns: Match the columns
    statements: Statements
    assertion_reason: Assertion and Reason
    two_part: Two answers
    new_type: New type (proposed)
  asks:
    fact_line: Stated fact
    reason_line: Stated reason
    compare: Comparison
    order: Sequence
    read_diagram: Figure reading
    calculate: Calculation
    relation: Proportionality
    apply_rule: Rule applied
    reaction: Reaction outcome
    experiment: Experiment
    new_asks: New ask (proposed)
  trap_v2:
    wrong_site_attacked: 'Wrong site attacked'
    no_trap: No trap
    nearby_fact: Neighbouring fact
    half_right: Partly correct
    arithmetic_slip: Arithmetic slip
    reversed: Reversed
    formula_misused: Formula misused
    answers_other_question: Answers another question
    condition_missed: Condition dropped
    new_trap: New trap (proposed)

# WHY A CARD IS LEFT OUT OF THE COUNTS.
# The card stays on the page; the judgement is still worth reading. What it must not do is join
# a count, because a pattern built on a misprinted stem or a deleted topic describes the fault.
flags:
- question_fault
- disputed_key
- out_of_syllabus
- check_figure
flag_means:
  question_fault: the question as printed does not work
  disputed_key: the paper awarded more than one option, or the key is contested
  out_of_syllabus: the NCERT check found the topic is not in the current edition
  check_figure: the stored figure and the stem disagree
