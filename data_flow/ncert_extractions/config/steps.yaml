QCA:
  stage: "Q"
  name: "Concept and approach"
  item: "a physics or physical-chemistry question B3V has read"
  agent: "q-concept-approach"
  runs: 1
  needs: "QCHAP"
  # Scoped by the CONFIRMED subject only. QCHAP supplies chemistry's branch, which is how a
  # physical-chemistry question is told from an organic one -- organic is deliberately out of
  # scope, because its reactions ARE printed in NCERT and are quoted like any other evidence.
  input_fields: [question_id, stem_en, statements, list_i, list_ii, options_en, structure,
                 figure_image, question_image]
  output_schema: schemas/QCA.json
  check: scripts/qca_plugin.py
  # On failure: retry once, then leave the question without a concept. A wrong concept is worse
  # than none -- it is the line a reader trusts when they stop reading the question.
  fallback: [retry]
  flags:
    QCA_CONCEPT_IS_A_SENTENCE: normal
    QCA_WRONG_ID: blocker
  safe_default: "no concept recorded"
